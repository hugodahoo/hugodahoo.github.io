    <!-- Critical CSS inline for faster rendering -->
    <style>
        /* Critical above-the-fold styles */
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .main-container { min-height: 100vh; position: relative; }
        .concentric-squares { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .project-section { position: relative; z-index: 10; }
        .project-grid { display: block; padding: 0; }
        .loading { 
            text-align: center; 
            padding: 50px; 
            color: #90EE90; 
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #90EE90;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
    
    <!-- Load non-critical resources asynchronously -->
    <script>
        // Show loading state immediately
        document.addEventListener('DOMContentLoaded', function() {
            const projectGrid = document.getElementById('list-1');
            projectGrid.innerHTML = '<div class="loading loading-dots">' + i18n.t('loading.projects') + '</div>';
        });
    </script>
    
    <!-- Load data asynchronously to prevent blocking -->
    <script>
        // Load data asynchronously with caching
        function loadData() {
            return new Promise((resolve) => {
                // Check if data is already cached in sessionStorage
                const cachedData = sessionStorage.getItem('projectsData');
                const cachedMedia = sessionStorage.getItem('mediaData');
                
                // Clear cache to force fresh load (temporary fix)
                sessionStorage.removeItem('projectsData');
                sessionStorage.removeItem('mediaData');
                
                
                if (false && cachedData && cachedMedia) {
                    
                    try {
                        window.projects = JSON.parse(cachedData);
                        window.projectMedia = JSON.parse(cachedMedia);
                        // Load neural network script
                        const neuralScript = document.createElement('script');
                        neuralScript.src = 'neural-network.js?v=351';
                        neuralScript.onload = () => {
                            setTimeout(() => {
                                
                                
                                
                                if (window.initializeNeuralNetwork) {
                                    
                                    window.initializeNeuralNetwork();
                                } else {
                                    
                                }
                                resolve();
                            }, 100);
                        };
                        document.head.appendChild(neuralScript);
                        return;
                    } catch (e) {
                        
                    }
                }
                
                // Load fresh data
                const script = document.createElement('script');
                script.src = 'data.js?v=17';
                script.onload = () => {
                    
                    
                    const mediaScript = document.createElement('script');
                    mediaScript.src = 'media/index.js?v=10';
                    mediaScript.onload = () => {
                        
                        // Cache the data for future use
                        sessionStorage.setItem('projectsData', JSON.stringify(window.projects));
                        sessionStorage.setItem('mediaData', JSON.stringify(window.projectMedia));
                        
                        
                        const neuralScript = document.createElement('script');
                        neuralScript.src = 'neural-network.js?v=351';
                        neuralScript.onload = () => {
                            // Small delay to ensure data is fully loaded
                            setTimeout(() => {
                                
                                
                                
                                // Refresh project cache to ensure overlay and project pages are synchronized
                                if (window.refreshProjectCache) {
                                    window.refreshProjectCache();
                                }
                                // Initialize the neural network after script is loaded
                                if (window.initializeNeuralNetwork) {
                                    
                                    window.initializeNeuralNetwork();
                                } else {
                                    
                                }
                                resolve();
                            }, 100);
                        };
                        document.head.appendChild(neuralScript);
                    };
                    document.head.appendChild(mediaScript);
                };
                document.head.appendChild(script);
            });
        }
        
        // Start loading data when DOM is ready
        document.addEventListener('DOMContentLoaded', async function() {
            const projectGrid = document.getElementById('list-1');
            if (projectGrid) {
                projectGrid.innerHTML = '<div class="loading loading-dots">' + i18n.t('loading.projects') + '</div>';
            }
            
            try {
                await loadData();
                // Neural network is initialized in loadData() after scripts are loaded
            } catch (error) {
                console.error('Error loading data:', error);
                if (projectGrid) {
                    projectGrid.innerHTML = '<div class="loading">' + i18n.t('loading.error') + '</div>';
                }
            }
        });
    </script>
    
    <script>
        // Mobile sticky bar: show on scroll-up, hide on scroll-down
        document.addEventListener('DOMContentLoaded', function() {
            if (window.innerWidth > 768) return;
            const stickyBar = document.getElementById('mobile-sticky-bar');
            const hero = document.getElementById('mobile-hero');
            if (!stickyBar || !hero) return;

            let lastY = 0;
            let ticking = false;
            const scrollEl = document.querySelector('.main-container') || window;
            const getScrollY = () => scrollEl === window ? window.scrollY : scrollEl.scrollTop;

            function onScroll() {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(() => {
                    const y = getScrollY();
                    const heroBottom = hero.offsetHeight;
                    if (y > heroBottom) {
                        stickyBar.classList.toggle('visible', y < lastY);
                    } else {
                        stickyBar.classList.remove('visible');
                    }
                    lastY = y;
                    ticking = false;
                });
            }

            if (scrollEl === window) {
                window.addEventListener('scroll', onScroll, { passive: true });
            } else {
                scrollEl.addEventListener('scroll', onScroll, { passive: true });
            }

            // Tap sticky bar to scroll to top
            stickyBar.addEventListener('click', () => {
                if (scrollEl === window) window.scrollTo({ top: 0, behavior: 'smooth' });
                else scrollEl.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // Tap hero name to close overlays
            hero.addEventListener('click', function() {
                if (typeof closeProjectOverlay === 'function') closeProjectOverlay();
            });
        });
    </script>
