<body>

    <!-- Mobile Navigation Menu -->
    <nav class="mobile-nav-menu" id="mobile-nav-menu">
        <div class="nav-line"></div>
        <div class="nav-items">
            <a href="index.html" class="nav-item">INDEX</a>

    <main id="project"></main>
    
    <!-- Neural network background with 3 layers -->
    <div class="concentric-squares"></div>

    <script>
        // Refresh project cache to ensure overlay and project pages are synchronized
        if (window.refreshProjectCache) {
            window.refreshProjectCache();
        }
    </script>
    
    <script>
        // Mobile hamburger menu functionality for project page
        document.addEventListener('DOMContentLoaded', function() {
            const hamburgerMenu = document.getElementById('hamburger-menu');
            const mobileNavMenu = document.getElementById('mobile-nav-menu');
            const verticalName = document.getElementById('vertical-name');
            
            if (hamburgerMenu && mobileNavMenu) {
                hamburgerMenu.addEventListener('click', function() {
                    hamburgerMenu.classList.toggle('active');
                    mobileNavMenu.classList.toggle('open');
                });
            }
            
            // Close any open overlays when clicking on name
            if (verticalName) {
                verticalName.addEventListener('click', function() {
                    // Close mobile navigation menu if open
                    if (mobileNavMenu && mobileNavMenu.classList.contains('open')) {
                        mobileNavMenu.classList.remove('open');
                        hamburgerMenu.classList.remove('active');
                    }
                });
            }
        });
    </script>
    <script>
        
        
        
        
        const projectList = (window.projects || []);
        const extra = (window.projectMedia || {}).projects || {};
        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        
        
        
        
        
        const p = projectList.find(x => x.id === id);
        const root = document.getElementById("project");
        
        
        
        
        function renderMedia(url, title) {
            try {
                let m;
                if ((m = url.match(/^https?:\/\/(?:www\.)?youtu\.be\/([\w-]+)/))) {
                    const vid = m[1];
                    return `<div class="media"><iframe width="560" height="315" src="https://www.youtube.com/embed/${vid}" title="${title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`;
                }
                if ((m = url.match(/^https?:\/\/(?:www\.)?youtube\.com\/(?:watch\?v=|shorts\/)([\w-]+)/))) {
                    const vid = m[1];
                    return `<div class="media"><iframe width="560" height="315" src="https://www.youtube.com/embed/${vid}" title="${title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`;
                }
                if ((m = url.match(/^https?:\/\/(?:www\.)?vimeo\.com\/(\d+)/))) {
                    const vid = m[1];
                    return `<div class="media"><iframe src="https://player.vimeo.com/video/${vid}" width="640" height="360" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`;
                }
                const isVideo = /\.(mp4|webm|mov)$/i.test(url);
                return isVideo ? `<video controls src="${url}" preload="metadata"></video>` : `<img loading="lazy" src="${url}" alt="${title}">`;
            } catch (e) {
                return `<a target="_blank" rel="noopener" href="${url}">${url}</a>`;
            }
        }
        
        if (!p) {
            root.innerHTML = `<p>Projet introuvable.</p>`;
            
        } else {
            
            // Use fullDescription if available, otherwise fall back to description
            const mainDescription = p.fullDescription || p.description || "";
            
            // Parse description using same logic as the overlay (neural-network.js)
            let mainDescHtml = '';
            let bulletPointsHtml = '';
            
            if (p.fullDescription) {
                const formattedDesc = mainDescription
                    .replace(/\\n/g, '\n')
                    .split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0 && line !== '---' && line !== '--');
                
                let mainHtml = '';
                let bulletHtml = '';
                let currentSection = '';
                let inBulletSection = false;
                
                formattedDesc.forEach(line => {
                    if (line.startsWith('**') && line.endsWith('**')) {
                        if (currentSection) {
                            if (inBulletSection) bulletHtml += '</ul>';
                            else mainHtml += '</ul>';
                        }
                        const sectionTitle = line.substring(2, line.length - 2);
                        inBulletSection = sectionTitle.includes('Technical details') || 
                                        sectionTitle.includes('Challenges') || 
                                        sectionTitle.includes('Impact') || 
                                        sectionTitle.includes('Process');
                        let dataSection = '';
                        if (sectionTitle.includes('Technical details')) dataSection = 'technical';
                        else if (sectionTitle.includes('Challenges')) dataSection = 'challenges';
                        else if (sectionTitle.includes('Impact')) dataSection = 'impact';
                        else if (sectionTitle.includes('Process')) dataSection = 'process';
                        const headerHtml = '<h3 data-section="' + dataSection + '">' + sectionTitle + '</h3><ul>';
                        if (inBulletSection) bulletHtml += headerHtml;
                        else mainHtml += headerHtml;
                        currentSection = sectionTitle;
                    } else if (line === 'Technical details and implementation' || 
                               line === 'Challenges and solutions' || 
                               line === 'Impact and results' || 
                               line === 'Process and methodology') {
                        if (currentSection) {
                            if (inBulletSection) bulletHtml += '</ul>';
                            else mainHtml += '</ul>';
                        }
                        inBulletSection = true;
                        let dataSection = '';
                        if (line.includes('Technical details')) dataSection = 'technical';
                        else if (line.includes('Challenges')) dataSection = 'challenges';
                        else if (line.includes('Impact')) dataSection = 'impact';
                        else if (line.includes('Process')) dataSection = 'process';
                        const headerHtml = '<h3 data-section="' + dataSection + '">' + line + '</h3><ul>';
                        bulletHtml += headerHtml;
                        currentSection = line;
                    } else if (line.startsWith('- ') || line.startsWith('\u2022')) {
                        const bulletText = line.startsWith('- ') ? line.substring(2) : line.substring(1).trim();
                        if (inBulletSection) bulletHtml += '<li>' + bulletText + '</li>';
                        else mainHtml += '<li>' + bulletText + '</li>';
                    } else {
                        if (currentSection) {
                            if (inBulletSection) bulletHtml += '</ul>';
                            else mainHtml += '</ul>';
                            currentSection = '';
                            inBulletSection = false;
                        }
                        if (inBulletSection) bulletHtml += '<p>' + line + '</p>';
                        else mainHtml += '<p>' + line + '</p>';
                    }
                });
                if (currentSection) {
                    if (inBulletSection) bulletHtml += '</ul>';
                    else mainHtml += '</ul>';
                }
                mainDescHtml = mainHtml;
                bulletPointsHtml = bulletHtml;
            } else {
                mainDescHtml = '<p>' + mainDescription + '</p>';
            }
            // Get Instagram links
            const insta = (p.instagram || []).map(u => `<a target="_blank" rel="noopener" href="${u}">Instagram</a>`).join(" ? ");
            
            // Get project media (images/videos)
            const projectEntry = extra[p.id];
            const projectMediaFiles = projectEntry ? (projectEntry.files || []) : [];
            
            // Build content blocks (same structure as the overlay)
            let contentBlocks = [];
            
            // Video embed
            if (p.videoEmbed) {
                contentBlocks.push('<div class="content-block video-embed-section"><div class="video-section">' + renderMedia(p.videoEmbed, p.title) + '</div></div>');
            }
            
            // Impact title
            const impactTitle = p['impact-title'] || '';
            if (impactTitle) {
                let descOnly = impactTitle;
                const di = impactTitle.indexOf(' \u2014 ');
                if (di !== -1) descOnly = impactTitle.substring(di + 3);
                contentBlocks.push('<div class="content-block impact-title-block"><div class="impact-title-section"><h2 class="impact-title">' + descOnly + '</h2></div></div>');
            }
            
            // Main text with first image floated
            if (projectMediaFiles.length > 0) {
                const firstImg = 'media/' + projectMediaFiles[0].path;
                contentBlocks.push('<div class="content-block text-with-image"><div class="image-section"><img src="' + firstImg + '" alt="' + p.title + '" loading="lazy"></div><div class="text-section">' + mainDescHtml + '</div></div>');
            } else {
                contentBlocks.push('<div class="content-block text-only"><div class="text-section">' + mainDescHtml + '</div></div>');
            }
            
            // Image grid for remaining images
            if (projectMediaFiles.length > 1) {
                const gridHtml = projectMediaFiles.slice(1, 6).map(m => '<div class="image-grid-item"><img src="media/' + m.path + '" alt="' + p.title + '" loading="lazy"></div>').join('');
                contentBlocks.push('<div class="content-block image-grid-section"><div class="image-grid">' + gridHtml + '</div></div>');
            }
            
            // Technical bullet points
            if (bulletPointsHtml.trim()) {
                contentBlocks.push('<div class="content-block bullet-points-section"><div class="text-section bullet-points">' + bulletPointsHtml + '</div></div>');
            }
            
            // Render using same structure as the overlay
            const htmlContent = `
                <a href="index.html" class="back-link">Back to projects</a>
                <article class="project-article">
                    <header class="project-header" ${projectMediaFiles.length > 0 ? 'style="background-image: url(media/' + projectMediaFiles[0].path + ');"' : ''}>
                        <div class="header-overlay"></div>
                        <div class="header-content">
                            <h1>${p.title}</h1>
                            <p class="meta">${[p.year, p.client, p.role].filter(Boolean).join(" \u00b7 ")}</p>
                            <p class="tech">${p.technologies || ""}</p>
                        </div>
                    </header>
                    <div class="project-title-bar">
                        <h2 class="project-title-bar-name">${p.title}</h2>
                        <p class="project-title-bar-meta">${[p.year, p.client].filter(Boolean).join(" \u00b7 ")}</p>
                    </div>
                    <div class="project-content">
                        ${contentBlocks.join('')}
                    </div>
                    <footer class="project-footer">
                        ${insta ? '<p class="links">' + insta + '</p>' : ''}
                    </footer>
                </article>
            `;
            
            
            
            root.classList.add('project-overlay');
            root.innerHTML = htmlContent;
        }
        
        // Interactive controls removed

        // Click outside to go back feature removed to avoid conflicts with image manipulation
        
        // Initialize the 3-layer dotted background with mouse parallax
        document.addEventListener('DOMContentLoaded', function() {
            
            
            
            
            if (typeof generateConcentricSquares === 'function') {
                generateConcentricSquares();
                
            } else {
                console.error('generateConcentricSquares function not found');
            }
            
            if (typeof initParallaxEffect === 'function') {
                initParallaxEffect();
                
            } else {
                console.error('initParallaxEffect function not found');
            }
        });
        
        // Also initialize if DOM is already loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                
                if (typeof generateConcentricSquares === 'function') {
                    generateConcentricSquares();
                }
                if (typeof initParallaxEffect === 'function') {
                    initParallaxEffect();
                }
            });
        } else {
            
            if (typeof generateConcentricSquares === 'function') {
                generateConcentricSquares();
            }
            if (typeof initParallaxEffect === 'function') {
                initParallaxEffect();
            }
        }
        
        // Regenerate squares on window resize
        window.addEventListener('resize', function() {
            
            if (typeof generateConcentricSquares === 'function') {
                generateConcentricSquares();
            }
            setTimeout(() => {
                if (typeof initParallaxEffect === 'function') {
                    initParallaxEffect();
                }
            }, 100);
        });
        
        // Debug: Check if container exists
        setTimeout(() => {
            const container = document.querySelector('.concentric-squares');
            
            if (container) {
                
            }
        }, 1000);
    </script>
</body>
